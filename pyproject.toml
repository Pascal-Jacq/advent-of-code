[project]
name = "advent-of-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.1.0",
    "lxml>=6.0.2",
    "networkx>=3.6",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "requests>=2.32.5",
]
[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["advent"]